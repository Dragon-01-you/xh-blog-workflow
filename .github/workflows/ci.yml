name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify Codebase, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pnpm Dependencies
        run: pnpm install

      - name: Generate Local Mock Environment (.env.local)
        run: |
          cat << 'EOF' > .env.local
          PUBLIC_SITE_URL=http://127.0.0.1:3000
          SITE_URL=http://127.0.0.1:3000
          ADMIN_EMAIL=creator@example.com
          ADMIN_PASSWORD=ci_test_secure_password_2026
          AMA_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RATE_LIMIT_HASH_KEY=AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
          DATABASE_URL=postgresql://runtime:runtime@127.0.0.1:5432/xinhuo_local
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_local_sandbox_placeholder
          CLERK_SECRET_KEY=sk_test_local_sandbox_placeholder
          RESUME_PASSPHRASE=
          RESUME_SESSION_SECRET=
          EOF

      - name: Python CLI Smoke Tests & Kernel Lock Verification
        run: python tests/test_smoke.py

      - name: TypeScript Typecheck
        run: pnpm exec tsc --noEmit

      - name: Run Vitest Unit Tests (74/74)
        run: pnpm test:run

      - name: Next.js Static Site Build (21 SSG Routes)
        run: pnpm build
