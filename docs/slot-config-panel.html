<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博客槽位配置面板 · xh-blog-workflow</title>
<style>
/* SECTION: base-tokens */
:root{
  --paper:#f7f4ed; --paper-2:#efeade; --card:#fffdf8; --ink:#171717; --ink-2:#3c3833;
  --muted:#8a8172; --line:#d8d0be; --line-2:#c2b8a2; --red:#a2382c; --amber:#9a6b12; --green:#2f6b3a;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.6;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.014) 0 1px,transparent 1px 4px)}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--card);
  border:1px solid var(--line-2);border-radius:2px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 2px rgba(23,23,23,.08)}
label{display:block;font-size:12px;letter-spacing:.04em;color:var(--muted);margin:0 0 4px}
/* SECTION: shell */
header.masthead{border-bottom:2px solid var(--ink);padding:18px 20px 14px;background:var(--paper);position:sticky;top:0;z-index:30}
.mast-row{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
h1{font-size:19px;margin:0;letter-spacing:.01em}
h1 .no{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:8px}
.tag{font-size:12px;color:var(--muted)}
nav.tabs{max-width:1360px;margin:12px auto 0;display:flex;flex-wrap:wrap;gap:6px}
nav.tabs button{border:1px solid var(--line-2);background:var(--card);padding:7px 13px;font-size:13px;cursor:pointer;border-radius:2px}
nav.tabs button[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{max-width:1360px;margin:0 auto;padding:20px 20px 80px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
@media(max-width:1040px){.split{grid-template-columns:1fr}.side{position:static!important}}
section.panel{background:var(--card);border:1px solid var(--line);padding:16px 18px 18px;margin:0 0 16px}
section.panel>h2{font-size:15px;margin:0 0 3px;padding-bottom:9px;border-bottom:1px solid var(--line);letter-spacing:.02em}
section.panel>h2 .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:7px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.grid{display:grid;gap:12px;margin-top:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
/* SECTION: tiers */
.tier{border-left:3px solid var(--ink);padding:2px 0 2px 12px;margin:0 0 16px}
.tier.locked{border-color:var(--ink)}.tier.neutral{border-color:var(--amber)}.tier.own{border-color:var(--green)}
.tier h3{margin:0 0 4px;font-size:14px}
.tier .who{font-family:var(--mono);font-size:11px;color:var(--muted)}
table.matrix{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.matrix th{text-align:left;font-weight:normal;font-size:11px;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--ink);padding:6px 8px 6px 0}
table.matrix td{border-bottom:1px solid var(--line);padding:8px 8px 8px 0;vertical-align:top}
table.matrix td .tagfix{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border:1px solid var(--line-2);border-radius:99px;margin:0 4px 3px 0;color:var(--ink-2);cursor:pointer;background:var(--card)}
.pill[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill.fix{cursor:default;background:var(--paper-2)}
/* SECTION: cards */
.card{border:1px solid var(--line-2);background:var(--paper);padding:12px 13px;margin:10px 0}
.card .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:-2px 0 10px}
.card .bar .ttl{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--card);padding:6px 11px;font-size:12.5px;cursor:pointer;border-radius:2px}
.btn:hover{border-color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--red);border-color:#dcc4bd}
.addbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* SECTION: side */
aside.side{position:sticky;top:132px}
.dlg{border:2px solid var(--ink);background:var(--card);padding:14px 15px}
.dlg h2{font-size:14px;margin:0 0 2px}
.dlg .cnt{font-family:var(--mono);font-size:11px;color:var(--muted)}
ul.issues{list-style:none;margin:12px 0 0;padding:0;font-size:13px}
ul.issues li{padding:8px 0 8px 0;border-top:1px solid var(--line)}
ul.issues li .code{font-family:var(--mono);font-size:10.5px;color:var(--red);letter-spacing:.04em}
ul.issues li.warn .code{color:var(--amber)}
ul.issues li.ok .code{color:var(--green)}
ul.issues li .q{display:block;margin-top:2px}
ul.issues li .why{font-size:11.5px;color:var(--muted)}
.prev{margin-top:14px;border:1px solid var(--line-2);background:var(--paper);padding:12px 13px;font-size:13px}
.prev .lbl{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.prev a{color:var(--ink);border-bottom:1px solid var(--line-2);text-decoration:none}
.sealselect{border:1px solid var(--ink);padding:10px;margin-top:8px;display:flex;gap:10px;align-items:center}
.sealselect .qr{width:54px;height:54px;border:1px solid var(--line-2);flex:0 0 auto;display:grid;place-items:center;font-size:9px;font-family:var(--mono);color:var(--muted);background-image:repeating-conic-gradient(var(--ink) 0 25%,var(--card) 0 50%);background-size:8px 8px}
/* SECTION: export */
pre.code{font-family:var(--mono);font-size:11.5px;line-height:1.55;background:#1c1b19;color:#efeade;padding:13px 14px;overflow:auto;max-height:340px;border-radius:2px;margin:10px 0 0;white-space:pre}
.exptabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
details.fold{border:1px solid var(--line);padding:9px 12px;margin:9px 0;background:var(--paper)}
details.fold summary{cursor:pointer;font-size:13.5px}
.note{font-size:12px;color:var(--muted);margin-top:9px;border-top:1px dashed var(--line-2);padding-top:8px}
.err{border-color:var(--red)!important;background:#fdf3f1!important}
.badge{font-family:var(--mono);font-size:10px;border:1px solid var(--line-2);padding:1px 6px;margin-left:6px;color:var(--muted)}
</style>
</head>
<body>
<!-- SECTION: masthead -->
<header class="masthead">
  <div class="mast-row">
    <h1><span class="no">XH-BLOG / SLOT KIT</span>博客槽位配置面板</h1>
    <div class="tag" id="stamp"></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="tier" aria-selected="true">三档权责</button>
    <button role="tab" data-tab="id">① 身份必填</button>
    <button role="tab" data-tab="chan">② 渠道矩阵</button>
    <button role="tab" data-tab="entry">③ 内容条目</button>
    <button role="tab" data-tab="pref">④ 显示开关</button>
    <button role="tab" data-tab="out">⑤ 体检与导出</button>
  </nav>
</header>

<main>
<div class="split">
  <div id="work"></div>

  <!-- SECTION: side-doctor -->
  <aside class="side">
    <div class="dlg">
      <h2>实时体检（同 doctor 规则）</h2>
      <div class="cnt" id="docnt"></div>
      <ul class="issues" id="issues"></ul>
      <div class="prev" id="prev"></div>
    </div>
    <p class="hint">本页只存在你浏览器本地（localStorage 草稿），不上传任何数据。导出物需人工放进仓库后由 <span style="font-family:var(--mono)">pnpm doctor</span> 复核。</p>
  </aside>
</div>
</main>

<script>
/* SECTION: constants */
var FIXED = [
  {k:'app/globals.css（6,972 行瑞士纸墨样式表）', why:'质感本体，改一行全站塌'},
  {k:'WebGPU 着色器 Ink / Portrait / Blueprint', why:'GPU 光影与优雅降级链路'},
  {k:'半色调肖像组件 halftone-portrait', why:'网点印刷与原色写真双向切换'},
  {k:'底栏 Dock 弹簧物理与磁吸', why:'阻尼参数是母版手感的一部分'},
  {k:'路由结构与 SSG 预渲染', why:'22 条路由 / 静态编译是验收基线'},
  {k:'禁止 href="#" 死链、外链 rel 安全', why:'这是卫生规则，不是内容'},
  {k:'文章必须有可定位的引文出处', why:'防止换人后编造事实'}
];
var NEUTRAL = [
  {k:'渠道默认图标包（17 个）', d:'lib/channel-icons.tsx', note:'不选就用模板自带图标；想换只改 icon 字段'},
  {k:'栏目标题与浮标文案（公众号 / 小报童·筹备中 / 次贡献 / 关注者）', d:'lib/ui-labels.ts', note:'原为 K 代码内写死，已抽为可换'},
  {k:'量化项开关（26 周热力图 / 贡献数 / 关注者 / Star）', d:'lib/channels.ts → channelPrefs', note:'历史人物、无 GitHub 的人可整块关掉'},
  {k:'页脚版权年份', d:'channelPrefs.copyrightYear', note:'默认跟随系统年，可写死为 1790 等'},
  {k:'书架 / 唱片架条目模板（字段与书脊配色）', d:'lib/personal.ts → books / records', note:'推荐"复制一条再改"，不要从零写'},
  {k:'底栏按钮数量与位置', d:'channels.ts showIn', note:'没有二维码类渠道时该按钮自动消失'}
];
var OWN = [
  {k:'名字 / 英文名 / 身份宣言 / 简介 / 城市与经纬度'},
  {k:'每个平台的真实链接或二维码图'},
  {k:'履历时间轴（必须真实年份，不得编造）'},
  {k:'原创文章（含 1200×675 题图、≥2 个二级标题、出处段落）'},
  {k:'项目 / 书 / 唱片的名称、年份、来源链接、封面图'},
  {k:'联络邮箱（没有就明确留空，不要放占位邮箱）'}
];
var ICONS = ['wechat','xiaohongshu','github','xiaobaotong','newspaper','mail','rss','book','archive','podcast','video','microblog','forum','scholar','store','photography','writing','community','link'];
var KINDS = {
  'qr-image':'二维码 / 印记浮显（点击弹出图片）',
  'external':'链接跳转（点文字直接外跳）',
  'email':'邮箱（邮戳卡）',
  'github-heatmap':'GitHub 贡献热力图'
};
var CHANNEL_PRESETS = [
  {label:'微信公众号', key:'wechat', kind:'qr-image', icon:'wechat', tone:'text-emerald-600 dark:text-emerald-400', hint:'微信扫一扫 · 关注公众号', showIn:['home','footer','dock']},
  {label:'抖音（主页链接）', key:'douyin-link', kind:'external', icon:'video', href:''},
  {label:'抖音（二维码浮显）', key:'douyin-qr', kind:'qr-image', icon:'video', image:'', hint:'抖音扫码 · 看我的短视频', showIn:['home','footer','dock']},
  {label:'哔哩哔哩', key:'bilibili', kind:'external', icon:'video'},
  {label:'知乎', key:'zhihu', kind:'external', icon:'writing'},
  {label:'小宇宙播客', key:'podcast', kind:'external', icon:'podcast'},
  {label:'Substack / Newsletter', key:'newsletter', kind:'external', icon:'newspaper'},
  {label:'X / 微博', key:'microblog', kind:'external', icon:'microblog'},
  {label:'小红书', key:'xiaohongshu', kind:'external', icon:'xiaohongshu', tone:'text-rose-600 dark:text-rose-400'},
  {label:'GitHub', key:'github', kind:'github-heatmap', icon:'github'},
  {label:'RSS 订阅', key:'rss', kind:'external', icon:'rss', href:'/feed.xml'},
  {label:'邮箱', key:'email', kind:'email', icon:'mail'},
  {label:'个人网站', key:'site', kind:'external', icon:'link'}
];
var ENTRY_FIELDS = {
  books:[['title','书名'],['author','作者'],['year','年份','num'],['category','分类'],['spineTitle','书脊短名'],['spineColor','书脊色','color'],['spineInk','书脊字色','color'],['cover','封面路径 /images/books/x.jpg'],['coverWidth','封面宽','num'],['coverHeight','封面高','num'],['url','来源链接'],['comment','一句话批注']],
  records:[['album','曲名 / 专辑'],['artist','演奏者 / 作者'],['year','年份','num'],['genre','类型'],['spineColor','封套脊色','color'],['spineInk','封套脊字色','color'],['cover','封套路径 /images/records/x.jpg'],['url','来源链接'],['mood','何时听'],['comment','一句话批注']],
  projects:[['name','项目名'],['nameEn','英文名'],['year','起始年','num'],['domain','领域标签'],['url','直达链接'],['icon','图标路径 /images/projects/x.png'],['description','一段说明']]
};

/* SECTION: state */
var LS='xh-slot-kit-v1';
var S = load() || {
  name:'', enName:'', tagline:'', bio:'', city:'', lat:'', lng:'', email:'',
  handle:'', wechatName:'', wechatQr:'',
  channels:[], disabled:['xiaohongshu','xiaobaotong'],
  prefs:{ graph:false, weeks:26, followers:false, yearMode:'inherit', year:1790 },
  entries:{ books:[], records:[], projects:[] },
  articles:[], allow:[], tab:'tier'
};
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)) }catch(e){} }
function load(){ try{ var r=localStorage.getItem(LS); return r?JSON.parse(r):null }catch(e){ return null } }

function uid(){ return 'x'+Math.random().toString(36).slice(2,8) }
function mkChannel(p){
  return { id:uid(), key:(p&&p.key)||'new-channel', label:(p&&p.label)||'', labelEn:(p&&p.labelEn)||((p&&p.label)||''),
    kind:(p&&p.kind)||'external', href:(p&&p.href)||'', image:(p&&p.image)||'', icon:(p&&p.icon)||'link',
    tone:(p&&p.tone)||'', hint:(p&&p.hint)||'', dockLabel:'', blurb:'', showIn:(p&&p.showIn)||['home','footer'] }
}
function mkEntry(list){
  var o={ id:uid() }; ENTRY_FIELDS[list].forEach(function(f){ o[f[0]] = f[2]==='num'?'' : (f[2]==='color'?'#583e2e' : '') }); return o
}
function mkArticle(){ return { id:uid(), slug:'', title:'', headings:2, cover:true, source:true } }

/* SECTION: helpers for DOM (防转义：只用 textContent / 属性赋值) */
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e }
function field(labelText, node, tip){
  var w=el('div'); w.appendChild(el('label',null,labelText)); w.appendChild(node);
  if(tip){ w.appendChild(el('div','hint',tip)) } return w
}
function inp(key, ph, val){
  var i=el('input'); i.type='text'; i.value=val!=null?val:''; i.placeholder=ph||'';
  i.addEventListener('input',function(){ setDeep(key, i.value); save(); refresh() }); return i
}
function setDeep(path, v){
  var parts=path.split('.'), o=S; for(var i=0;i<parts.length-1;i++){ o=o[parts[i]] } o[parts[parts.length-1]]=v
}
function get(path){ var parts=path.split('.'), o=S; for(var i=0;i<parts.length;i++){ if(o==null) return ''; o=o[parts[i]] } return o==null?'':o }

/* SECTION: render router */
var work=document.getElementById('work');
function show(tab){
  S.tab=tab; save();
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){
    b.setAttribute('aria-selected', b.dataset.tab===tab ? 'true':'false')
  });
  work.innerHTML='';
  ({tier:renderTier, id:renderId, chan:renderChan, entry:renderEntry, pref:renderPref, out:renderOut}[tab]||renderTier)();
  refresh();
}
function refresh(){ renderDoctor(); renderPreview() }

/* SECTION: tab 三档 */
function renderTier(){
  var t1=el('section','panel'); t1.appendChild(el('h2',null,'三档权责总览'));
  t1.appendChild(el('p','hint','先把责任分清：母版质感不动、中性默认可以换、真实内容必须本人给。面板里每一项都标了归属，改哪一档心里有数。'));
  function blk(cls, no, title, who, arr, colTxt){
    var d=el('div','tier '+cls);
    d.appendChild(el('h3',null,title));
    d.appendChild(el('div','who',who));
    if(colTxt) d.appendChild(el('p','hint',colTxt));
    var tb=el('table','matrix'); var trh=el('tr');
    ['条目','所在文件 / 原因'].forEach(function(h,ix){ var th=el('th'); th.textContent=h; if(ix===0) th.style.width='48%'; trh.appendChild(th) });
    tb.appendChild(trh);
    arr.forEach(function(it){
      var tr=el('tr'); var a=el('td'); a.textContent=it.k||it; tr.appendChild(a);
      var b=el('td'); var s=el('span','tagfix'); s.textContent=it.d?it.d:(it.why||'—'); b.appendChild(s);
      if(it.note){ b.appendChild(el('div','hint',it.note)) }
      tr.appendChild(b); tb.appendChild(tr)
    });
    d.appendChild(tb); return d
  }
  t1.appendChild(blk('locked','A','第 ① 档 · 必须固定（动它 = 毁母版）','归属：K 代码内核 · 49 个哈希锁文件 · 不开放给面板',FIXED));
  t1.appendChild(blk('neutral','B','第 ② 档 · 中性：默认用模板的，可换可不换','归属：V 槽位（本面板可直接改）',NEUTRAL));
  t1.appendChild(blk('own','C','第 ③ 档 · 必须本人提供（缺了会被体检拦住）','归属：V 槽位 · doctor 硬门禁项',OWN,'这些不能替你编：年份、链接、封面、文章出处，都必须来自本人或其真实作品。'));
  work.appendChild(t1);

  var tip=el('section','panel'); tip.appendChild(el('h2',null,'复用优先：三条铁律'));
  var ul=el('ul'); [
    ['不要从 0 到 1 造条目','多一本书就用「复制一条」按钮把现有条目连字段带书脊配色一起带走，只改内容，字段顺序和必填项就不会漏。'],
    ['新平台先判断形态','对方给的是链接还是二维码？链接 → kind:external（页脚多一行可跳转）；二维码 → kind:qr-image（像公众号那样点击浮显图片）。两者不要混填。'],
    ['不写占位假数据','没有该平台就在渠道里删掉，并写进 disabledChannels 显式声明。留空字段会被体检判定为「声明了却没落地物」并拦住构建。']
  ].forEach(function(p){ var li=el('li'); li.appendChild(el('strong',null,p[0])); li.appendChild(el('div','hint',p[1])); ul.appendChild(li) });
  tip.appendChild(ul); work.appendChild(tip)
}

/* SECTION: tab 身份 */
function renderId(){
  var p=el('section','panel'); p.appendChild(el('h2',null,'①  身份与坐标（第 ③ 档 · 必填）'));
  var g=el('div','grid g2');
  g.appendChild(field('名字 / 站名 name', inp('name','例：张三')))
  g.appendChild(field('英文名 / 拼音 enName', inp('enName','例：San Zhang')))
  g.appendChild(field('一句话身份宣言 tagline', inp('tagline','印刷匠 · 公共事务的仆人')))
  g.appendChild(field('社交 handle', inp('handle','用于卡片与署名')))
  work.appendChild(p); p.appendChild(g)
  var g2=el('div','grid g3')
  var citySel=el('select'); citySel.innerHTML='<option value="">— 选城市自动填经纬度和时区 —</option>'+
    [['北京','39.9042° N','116.4074° E','UTC+8'],['上海','31.2304° N','121.4737° E','UTC+8'],
     ['广州','23.1291° N','113.2644° E','UTC+8'],['深圳','22.5431° N','114.0579° E','UTC+8'],
     ['成都','30.5728° N','104.0668° E','UTC+8'],['杭州','30.2741° N','120.1551° E','UTC+8'],
     ['西安','34.3416° N','108.9398° E','UTC+8'],['南京','32.0603° N','118.7969° E','UTC+8'],
     ['武汉','30.5928° N','114.3055° E','UTC+8'],['长沙','28.2280° N','112.9388° E','UTC+8'],

function check(){
  var Q=[], E=[], N=[];
  if(!S.name) Q.push(['identity.name','这位创作者对外使用的名字是什么？','brandConfig.name 为空']);
  if(!S.enName || S.enName===S.name) Q.push(['identity.enName','他的英文名 / 拼音 / handle 是什么？','enName 缺失或与中文名相同']);
  if(!S.tagline) Q.push(['identity.tagline','一句话身份宣言是什么？','tagline 为空']);
  if(!S.city) Q.push(['identity.location','常驻城市与时区？页脚坐标印章还需经纬度','location 为空']);
  if(!S.bio) Q.push(['identity.bio','3–4 段自我介绍（关于卡、页脚、llms.txt 共用）','bio 为空']);
  if(!S.email) Q.push(['contact.email','页脚邮戳用的邮箱？没有就明确留空','email 为空']);
  S.channels.forEach(function(c, ix){
    if(c.kind==='external' && !c.href) E.push(['CHANNEL_NO_TARGET','渠道「'+(c.label||c.key)+'」标为跳转链接却没给 href','是链接就给完整 https://；是二维码就改成 qr-image 并上传图样']);
    if(c.kind==='external' && c.href && !/^https?:\/\//i.test(c.href)) E.push(['BAD_URL','渠道「'+(c.label||c.key)+'」的 href 不是完整 URL','请以 https:// 开头']);
    if(c.kind==='qr-image' && !c.image) E.push(['CHANNEL_NO_TARGET','渠道「'+(c.label||c.key)+'」要做浮显但没有图样','把二维码传到 public/images/ 后填 image']);
    if(!c.showIn.length) E.push(['CHANNEL_ORPHAN','渠道「'+(c.label||c.key)+'」没有出现在任何位置','勾上首页 / 页脚 / 底栏至少一处']);
  });
  if(!S.disabled.indexOf && S.disabled.length) {}
  ['wechat','xiaohongshu','github'].forEach(function(k){
    var declared = k==='wechat' ? !!S.wechatName : S.channels.some(function(c){ return c.key===k });
    if(declared && S.disabled.indexOf(k)<0 && !S.channels.some(function(c){ return c.key===k })) {
      E.push(['CHANNEL_UNDECLARED','系统里提到 '+k+' 但渠道矩阵没有它，也没显式声明不要','要么加进渠道，要么勾「不要」'])
    }
  });
  S.articles.forEach(function(a, ix){
    var nm=a.title||('第'+(ix+1)+'篇');
    if(!a.slug) E.push(['MISSING_SLUG',nm+' 没有 slug','slug 用英文小写连字符']);
    if(!a.cover) E.push(['MISSING_ASSET',nm+' 缺 1200×675 题图','请提供题图或删掉该篇']);
    if(!a.source) Q.push(['article.source:'+a.slug, nm+' 的事实来源是什么？文末要补一段「本篇底本与引文出处」','无出处段落']);
    if(a.headings<2) Q.push(['article.headings:'+a.slug, nm+' 只有 '+a.headings+' 个二级标题，导航尺不会渲染，可否补到 2 个以上？','post-toc 需 >=2 landmark']);
  });
  ['books','records','projects'].forEach(function(list){
    S.entries[list].forEach(function(it, ix){
      var nm = it.title||it.album||it.name||('#'+(ix+1));
      if(!nm) E.push(['EMPTY_ENTRY', list+' 第 '+(ix+1)+' 条没有名称','补名称或直接删除该条']);
      if(!it.url) Q.push([list+'.url', list+' 第 '+(ix+1)+' 条（'+nm+'）的来源链接是什么？','url 为空']);
      var img = it.cover||it.icon||it.art;
      if(nm && !img) E.push(['MISSING_ASSET', list+' 第 '+(ix+1)+' 条（'+nm+'）没有封面/图标路径','上传到 public/images/ 并填路径']);
      if(it.url && !/^https?:\/\//i.test(it.url)) E.push(['BAD_URL', list+' 第 '+(ix+1)+' 条链接不是完整 URL','请以 https:// 开头']);
    });
  });
  if(!S.articles.length) E.push(['NO_CONTENT','一篇文章都没登记','他有没有可发布的原创文章？']);
